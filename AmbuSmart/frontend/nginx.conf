server {
    listen 80; # Nginx 监听容器内部的 80 端口

    location / {
        root   /usr/share/nginx/html; # 这是 Vue 应用构建产物的位置
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # 确保 Vue 路由正常工作
    }

    # 代理所有 /api/ 开头的请求到后端服务
    location /api/ {
        proxy_pass http://backend:8000; # 注意这里是 http://backend:8000，Nginx内部的通信

        # **CORS Configuration - Crucial for Fetch API**
        # Allow requests from all origins (for development).
        # In production, replace '*' with your specific frontend domain, e.g., 'http://your-frontend-domain.com'
        add_header 'Access-Control-Allow-Origin' '*';
        # Allow common methods for your API. You might need to adjust this.
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT';
        # Allow common headers.
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        # Expose additional headers to the frontend if your backend uses them (e.g., for file sizes).
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

        # Handle OPTIONS preflight requests (browsers send these before complex requests like POST)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000; # How long browser should cache the preflight response (in seconds)
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204; # Return 204 No Content for OPTIONS requests
        }

        # **Stream-specific Headers for SSE (Server-Sent Events) / Long Polling**
        # These headers are essential for maintaining long-lived connections for streaming.
        proxy_http_version 1.1; # Crucial for Upgrade header
        proxy_set_header Upgrade $http_upgrade; # Used for WebSocket, but also good for SSE
        proxy_set_header Connection "upgrade"; # Or "keep-alive" for SSE depending on exact client/server behavior

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # Pass the original protocol (HTTP/HTTPS)

        # Increase timeouts for streaming (important for long AI responses)
        proxy_read_timeout 3600s; # Default is 60s, increase for long streams
        proxy_send_timeout 3600s; # Default is 60s, increase for long streams
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}